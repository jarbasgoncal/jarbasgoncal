name: Update Profile Stats SVG

on:
  schedule:
    # Executa diariamente à meia-noite (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite rodar manualmente na aba Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão para salvar os arquivos SVG no repositório

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }} # Opcional (veja o Passo 4)
        run: python update_profile.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update profile stats" && git push)
