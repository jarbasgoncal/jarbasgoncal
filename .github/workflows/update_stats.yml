name: Update Profile Stats SVG

on:
  schedule:
    - cron: '0 0 * * *' # Roda todos os dias à meia-noite
  workflow_dispatch: # Permite rodar manualmente no GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar script Python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          python update_profile.py
          pwd
          ls -lh dark_mode.svg light_mode.svg
          git status --short

      - name: Upload SVGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svgs
          path: |
            dark_mode.svg
            light_mode.svg
          if-no-files-found: warn

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --staged --quiet || git commit -m "Auto-update profile stats"
          git push
